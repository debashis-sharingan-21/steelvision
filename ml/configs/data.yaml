# Ultralytics YOLO dataset config for NEU-DET (or the synthetic stand-in with the same schema).
# No `path:` key here: with it omitted, Ultralytics resolves train/val/test relative to this
# file's own directory (ml/configs/), so the ../../data/... prefix below walks back up to the
# repo root regardless of the caller's current working directory.
train: ../../data/train/images
val: ../../data/val/images
test: ../../data/test/images

names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled-in_scale
  5: scratches
